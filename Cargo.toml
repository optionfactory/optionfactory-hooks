[package]
name = "optionfactory-hooks"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1.54.1", features = ["rt", "net", "signal"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
